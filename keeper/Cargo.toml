[package]
name = "fbyt-keeper"
version = "0.1.0"
edition = "2021"
description = "FBYT off-chain keeper — runs DCA/grid/rebalance bots via a vault's trading delegate."

[[bin]]
name = "fbyt-keeper"
path = "src/main.rs"

[dependencies]
anchor-client = "1.1.2"
anchor-lang = "1.1.2"
solana-keypair = "3"
solana-signer = "3"
solana-instruction = "3"
solana-rpc-client = "3"
fbyt_vault = { path = "../programs/fbyt_vault", features = ["no-entrypoint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
