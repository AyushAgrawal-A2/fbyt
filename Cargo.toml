[workspace]
members = [
    "programs/*"
]
exclude = ["programs/fbyt_vault/tests/jupiter-mock", "keeper"]
resolver = "2"

[workspace.package]
edition = "2024"
# MSRV floor for edition 2024. Must not exceed the SBF platform-tools compiler
# (rust 1.89.0-dev); the host build still uses 1.98 via rust-toolchain.toml.
rust-version = "1.85.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
